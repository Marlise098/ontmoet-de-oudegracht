openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /storage/public-objects/{assetName}:
    get:
      operationId: getPublicFilmAsset
      tags: [media]
      summary: Stream the supplied public archive film or its poster
      parameters:
        - in: path
          name: assetName
          required: true
          schema:
            type: string
            enum: [oudegracht-film-v1.mp4, oudegracht-poster-v1.jpg]
        - in: header
          name: Range
          schema:
            type: string
          description: A single bytes range for video seeking
      responses:
        "200":
          description: Complete media file
          content:
            video/mp4:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
        "206":
          description: Requested bytes of the media file
          content:
            video/mp4:
              schema: {type: string, format: binary}
        "404":
          description: Asset not found
        "416":
          description: Invalid or unsatisfiable byte range
        "503":
          description: Media storage unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

