<VirtualHost *:80>
    # Bezoekers-app:  http://localhost/
    # CMS:            http://localhost/cms/
    # Oud prototype:  http://localhost/prototype/Open-website.html
    DocumentRoot /var/www/html/src/public
    DirectoryIndex index.php index.html

    <Directory /var/www/html/src/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # De router is alleen voor de ingebouwde PHP-testserver
    <Files "router.php">
        Require all denied
    </Files>

    # In de uploadmap mogen nooit scripts worden uitgevoerd
    <Directory /var/www/html/src/public/uploads>
        php_admin_flag engine off
        <FilesMatch "\.(php|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # De film en het stilstaande beeld staan in website.prototype/media
    Alias /media/ /var/www/html/website.prototype/media/
    <Directory /var/www/html/website.prototype/media>
        Require all granted
    </Directory>

    Alias /prototype/ /var/www/html/website.prototype/
    <Directory /var/www/html/website.prototype>
        Require all granted
    </Directory>

    Header always set X-Content-Type-Options "nosniff"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
