<VirtualHost *:80>
    DocumentRoot /var/www/html/Website
    DirectoryIndex bezoekersapp/index.php index.php index.html

    <Directory /var/www/html/Website>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    Alias /cms/ /var/www/html/cms/cms/
    <Directory /var/www/html/cms/cms>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
