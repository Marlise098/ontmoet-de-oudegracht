services:
  web:
    build: .
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: db
      DB_NAME: ontmoet
      DB_USER: root
      DB_PASS: ${DB_ROOT_PASSWORD:-root}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_ROOT_HOST: "%"
      MARIADB_DATABASE: ontmoet
    volumes:
      - database:/var/lib/mysql
      # Schema en startinhoud worden bij de eerste start automatisch ingeladen
      - ./src/database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8081:80"

volumes:
  database:
